<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#050912" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Atom Smasher</title>
  <link rel="stylesheet" href="css/styles.css?v=3" />
</head>
<body>
  <div id="game-root"></div>

  <!-- Phaser MUST load first: scene classes extend Phaser.Scene at parse time -->
  <script src="lib/phaser.min.js?v=3"></script>

  <!-- Core logic (UMD - works in Node and browser) -->
  <script src="js/core/BoardModel.js?v=3"></script>
  <script src="js/core/AtomTypes.js?v=3"></script>
  <script src="js/core/ObstacleTypes.js?v=3"></script>
  <script src="js/core/LevelData.js?v=3"></script>
  <script src="js/core/SaveManager.js?v=3"></script>
  <script src="js/core/AssetManifest.js?v=3"></script>
  <script src="js/core/AudioManager.js?v=3"></script>

  <!-- Rendering -->
  <script src="js/rendering/TextureFactory.js?v=3"></script>
  <script src="js/rendering/AtomRenderer.js?v=3"></script>
  <script src="js/rendering/ParticleManager.js?v=3"></script>
  <script src="js/rendering/EffectManager.js?v=3"></script>

  <!-- Input -->
  <script src="js/input/SwapController.js?v=3"></script>

  <!-- Scenes (require Phaser) -->
  <script src="js/scenes/BootScene.js?v=3"></script>
  <script src="js/scenes/WorldMapScene.js?v=3"></script>
  <script src="js/scenes/BoosterScene.js?v=3"></script>
  <script src="js/scenes/GameScene.js?v=3"></script>
  <script src="js/scenes/PauseScene.js?v=3"></script>

  <!-- Main entry -->
  <script src="js/main.js?v=3"></script>
</body>
</html>
